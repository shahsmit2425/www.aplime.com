name: Validate and deploy matching environment
on:
  push:
    branches:
      - development
      - stagging
      - main
  pull_request:
    branches:
      - development
      - stagging
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      app-id: ${{ steps.target.outputs.app-id }}
      android-track: ${{ steps.target.outputs.android-track }}
      web: ${{ steps.affected.outputs.web }}
      api: ${{ steps.affected.outputs.api }}
      admin: ${{ steps.affected.outputs.admin }}
      worker: ${{ steps.affected.outputs.worker }}
      mobile: ${{ steps.affected.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select environment and enforce promotion order
        id: target
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          REF_BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-target.mjs
      - name: Select affected applications
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/affected.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-browser-env.mjs
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
  web:
    name: Deploy affected Render services
    needs: validate
    outputs:
      mobile-enabled: ${{ steps.mobile.outputs.enabled }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate.outputs.environment }}
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Read environment mobile release setting
        id: mobile
        env:
          ENABLED: ${{ vars.MOBILE_RELEASES_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Mobile publishing is disabled; deploying Render services only."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy exact validated commit and verify health
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_ADMIN_SERVICE_ID: ${{ vars.RENDER_ADMIN_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          API_URL: ${{ vars.API_URL }}
          ADMIN_URL: ${{ vars.ADMIN_URL }}
          DEPLOY_WEB: ${{ needs.validate.outputs.web }}
          DEPLOY_API: ${{ needs.validate.outputs.api == 'true' && vars.BACKEND_RELEASES_ENABLED == 'true' }}
          DEPLOY_ADMIN: ${{ needs.validate.outputs.admin }}
          DEPLOY_WORKER: ${{ needs.validate.outputs.worker == 'true' && vars.BACKEND_RELEASES_ENABLED == 'true' }}
        run: node scripts/deploy-render.mjs
  android:
    name: Android distribution
    needs:
      - validate
      - web
    if: github.event_name != 'pull_request' && needs.validate.outputs.mobile ==
      'true' && needs.web.outputs.mobile-enabled == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.environment }}
    env:
      APP_ENV: ${{ needs.validate.outputs.environment }}
      MOBILE_APP_ID: ${{ needs.validate.outputs.app-id }}
      ANDROID_TRACK: ${{ needs.validate.outputs.android-track }}
      SITE_URL: ${{ vars.SITE_URL }}
      BUILD_NUMBER: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require mobile configuration
        env:
          ENABLED: ${{ vars.MOBILE_RELEASES_ENABLED }}
        run:
          test "$ENABLED" = "true" || { echo "Set MOBILE_RELEASES_ENABLED=true after
          completing signing and store setup."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: npm ci
      - name: Set unique native build number
        run:
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >>
          "$GITHUB_ENV"
      - run: npm run mobile:sync
      - name: Prepare Android signing files
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: >
          test -n "$KEYSTORE" && test -n "$PLAY_JSON" && test -n
          "$GOOGLE_SERVICES_JSON_BASE64"

          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

          echo "PLAY_JSON_PATH=$RUNNER_TEMP/play.json" >> "$GITHUB_ENV"
      - run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease
      - run: bundle install
        env:
          BUNDLE_GEMFILE: fastlane/Gemfile
      - run: bundle exec fastlane android release
        env:
          BUNDLE_GEMFILE: fastlane/Gemfile
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.validate.outputs.environment }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
  ios:
    name: iOS TestFlight
    needs:
      - validate
      - web
    if: github.event_name != 'pull_request' && needs.validate.outputs.mobile ==
      'true' && needs.web.outputs.mobile-enabled == 'true'
    runs-on: macos-15
    environment: ${{ needs.validate.outputs.environment }}
    env:
      APP_ENV: ${{ needs.validate.outputs.environment }}
      MOBILE_APP_ID: ${{ needs.validate.outputs.app-id }}
      SITE_URL: ${{ vars.SITE_URL }}
      BUILD_NUMBER: ${{ github.run_number }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BUNDLE_GEMFILE: fastlane/Gemfile
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require mobile configuration
        env:
          ENABLED: ${{ vars.MOBILE_RELEASES_ENABLED }}
        run:
          test "$ENABLED" = "true" || { echo "Set MOBILE_RELEASES_ENABLED=true after
          completing signing and store setup."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: bundle install
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Validate Apple SDK version
        run:
          test "$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)"
          -ge 26
      - run: npm ci
      - name: Set unique native build number
        run:
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >>
          "$GITHUB_ENV"
      - run: npm run mobile:sync
      - run: bundle exec pod install --project-directory=ios/App
      - name: Prepare iOS signing files
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: >
          test -n "$CERTIFICATE" && test -n "$PROFILE" && test -n
          "$GOOGLE_SERVICE_INFO_PLIST_BASE64"

          printf '%s' "$CERTIFICATE" | base64 --decode >
          "$RUNNER_TEMP/distribution.p12"

          printf '%s' "$PROFILE" | base64 --decode >
          "$RUNNER_TEMP/distribution.mobileprovision"

          echo "IOS_CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12" >>
          "$GITHUB_ENV"

          echo "IOS_PROFILE_PATH=$RUNNER_TEMP/distribution.mobileprovision" >>
          "$GITHUB_ENV"
      - run: bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.validate.outputs.environment }}-${{ github.sha }}
          path: artifacts/ios/*.ipa
          retention-days: 14
